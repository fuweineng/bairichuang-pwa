<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial">
  <text x="350" y="25" text-anchor="middle" font-size="16" fill="#333">条形统计图：横轴=每周阅读时间(小时)，纵轴=学生人数(人)</text>
  <text x="350" y="48" text-anchor="middle" font-size="14" fill="#555">0~2h→5人，2~4h→15人，4~6h→30人，6~8h→20人，8~10h→5人</text>
  <g transform="translate(80,65)">
    <line x1="0" y1="220" x2="500" y2="220" stroke="black" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="black" stroke-width="2"/>
    <!-- Y轴 -->
    <text x="-10" y="5" font-size="11" text-anchor="end">35</text>
    <text x="-10" y="55" font-size="11" text-anchor="end">28</text>
    <text x="-10" y="105" font-size="11" text-anchor="end">21</text>
    <text x="-10" y="155" font-size="11" text-anchor="end">14</text>
    <text x="-10" y="205" font-size="11" text-anchor="end">7</text>
    <text x="-10" y="225" font-size="11" text-anchor="end">0</text>
    <!-- 柱子 -->
    <rect x="20" y="190" width="60" height="30" fill="#1976d2"/>
    <rect x="100" y="130" width="60" height="90" fill="#388e3c"/>
    <rect x="180" y="70" width="60" height="150" fill="#e91e63"/>
    <rect x="260" y="110" width="60" height="110" fill="#ff9800"/>
    <rect x="340" y="190" width="60" height="30" fill="#9c27b0"/>
    <!-- X轴标签 -->
    <text x="50" y="240" font-size="12" text-anchor="middle">0~2h</text>
    <text x="130" y="240" font-size="12" text-anchor="middle">2~4h</text>
    <text x="210" y="240" font-size="12" text-anchor="middle">4~6h</text>
    <text x="290" y="240" font-size="12" text-anchor="middle">6~8h</text>
    <text x="370" y="240" font-size="12" text-anchor="middle">8~10h</text>
    <!-- 数值 -->
    <text x="50" y="182" font-size="12" fill="#1976d2" text-anchor="middle">5人</text>
    <text x="130" y="122" font-size="12" fill="#388e3c" text-anchor="middle">15人</text>
    <text x="210" y="62" font-size="12" fill="#e91e63" text-anchor="middle">30人</text>
    <text x="290" y="102" font-size="12" fill="#ff9800" text-anchor="middle">20人</text>
    <text x="370" y="182" font-size="12" fill="#9c27b0" text-anchor="middle">5人</text>
    <!-- 答案 -->
    <text x="210" y="275" font-size="14" fill="#333">大多数学生每周阅读4~6小时，人数最多(30人)</text>
    <text x="210" y="298" font-size="14" fill="#d00" font-weight="bold">C正确（4~6小时人数最多）</text>
  </g>
</svg>