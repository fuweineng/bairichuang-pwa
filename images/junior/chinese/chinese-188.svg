<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial">
  <text x="350" y="25" text-anchor="middle" font-size="17" fill="#333">从图表信息中提取结论时，下列方法正确的是？</text>
  <g transform="translate(80,60)">
    <!-- 柱状图 -->
    <line x1="0" y1="200" x2="400" y2="200" stroke="black" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="black" stroke-width="2"/>
    <!-- 柱子 -->
    <rect x="30" y="100" width="40" height="100" fill="#1976d2"/>
    <rect x="90" y="60" width="40" height="140" fill="#388e3c"/>
    <rect x="150" y="30" width="40" height="170" fill="#f44336"/>
    <rect x="210" y="80" width="40" height="120" fill="#ff9800"/>
    <!-- Y轴标签 -->
    <text x="-10" y="5" font-size="12" text-anchor="end">100</text>
    <text x="-10" y="105" font-size="12" text-anchor="end">50</text>
    <text x="-10" y="205" font-size="12" text-anchor="end">0</text>
    <!-- X轴标签 -->
    <text x="50" y="225" font-size="12" text-anchor="middle">A</text>
    <text x="110" y="225" font-size="12" text-anchor="middle">B</text>
    <text x="170" y="225" font-size="12" text-anchor="middle">C</text>
    <text x="230" y="225" font-size="12" text-anchor="middle">D</text>
    <!-- 标注数值 -->
    <text x="50" y="90" font-size="11" fill="#1976d2" text-anchor="middle">50</text>
    <text x="110" y="50" font-size="11" fill="#388e3c" text-anchor="middle">70</text>
    <text x="170" y="20" font-size="11" fill="#f44336" text-anchor="middle">85</text>
    <text x="230" y="70" font-size="11" fill="#ff9800" text-anchor="middle">60</text>
    <!-- 分析 -->
    <text x="300" y="50" font-size="13" fill="#333">正确方法：</text>
    <text x="300" y="75" font-size="13" fill="#2a2">① 准确读取数据</text>
    <text x="300" y="98" font-size="13" fill="#2a2">② 比较数据差异</text>
    <text x="300" y="121" font-size="13" fill="#2a2">③ 结合数据单位</text>
    <text x="300" y="144" font-size="13" fill="#2a2">④ 避免过度推断</text>
  </g>
</svg>