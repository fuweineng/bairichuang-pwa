<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial">
  <text x="350" y="25" text-anchor="middle" font-size="17" fill="#333">△ABC与△DEF相似，AB=4cm，DE=8cm，EF=12cm，求BC长度</text>
  <g transform="translate(80,60)">
    <!-- △ABC -->
    <polygon points="50,200 150,200 80,80" fill="none" stroke="black" stroke-width="2"/>
    <text x="80" y="65" font-size="14" fill="#333">A</text>
    <text x="35" y="215" font-size="14" fill="#333">B</text>
    <text x="165" y="215" font-size="14" fill="#333">C</text>
    <text x="95" y="160" font-size="13" fill="#0055aa">AB=4cm</text>
    <text x="150" y="130" font-size="13" fill="#0055aa">BC=?</text>
    <!-- △DEF -->
    <polygon points="320,200 520,200 390,60" fill="none" stroke="black" stroke-width="2"/>
    <text x="390" y="45" font-size="14" fill="#333">D</text>
    <text x="305" y="215" font-size="14" fill="#333">E</text>
    <text x="535" y="215" font-size="14" fill="#333">F</text>
    <text x="420" y="160" font-size="13" fill="#0055aa">DE=8cm</text>
    <text x="480" y="120" font-size="13" fill="#0055aa">EF=12cm</text>
    <!-- 相似标记 -->
    <text x="210" y="120" font-size="20" fill="#d00">∽</text>
    <!-- 计算 -->
    <text x="300" y="270" font-size="14" fill="#333">相似比 = AB/DE = 4/8 = 1/2</text>
    <text x="300" y="295" font-size="14" fill="#d00">BC = EF × (1/2) = 12 × ½ = 6cm</text>
  </g>
</svg>