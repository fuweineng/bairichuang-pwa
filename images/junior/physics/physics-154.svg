<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Arial">
  <text x="350" y="25" text-anchor="middle" font-size="17" fill="#333">U=12V, R₁=4Ω, R₂=6Ω并联后再与R₃=3Ω串联，求总电阻和总电流</text>
  <g transform="translate(100,60)">
    <!-- 电源 -->
    <line x1="0" y1="100" x2="40" y2="100" stroke="black" stroke-width="2"/>
    <line x1="40" y1="85" x2="40" y2="115" stroke="black" stroke-width="2"/>
    <line x1="55" y1="85" x2="55" y2="115" stroke="black" stroke-width="2"/>
    <line x1="55" y1="100" x2="90" y2="100" stroke="black" stroke-width="2"/>
    <text x="47" y="80" font-size="14" fill="#d00" text-anchor="middle">+</text>
    <text x="47" y="130" font-size="13" fill="#333">12V</text>
    <!-- R1 -->
    <line x1="90" y1="100" x2="130" y2="100" stroke="black" stroke-width="2"/>
    <rect x="130" y="85" width="60" height="30" fill="none" stroke="black" stroke-width="2"/>
    <text x="160" y="78" font-size="13" fill="#0055aa" text-anchor="middle">R₁=4Ω</text>
    <line x1="190" y1="100" x2="240" y2="100" stroke="black" stroke-width="2"/>
    <!-- R2 -->
    <line x1="90" y1="100" x2="90" y2="200" stroke="black" stroke-width="2"/>
    <line x1="90" y1="200" x2="130" y2="200" stroke="black" stroke-width="2"/>
    <rect x="130" y="185" width="60" height="30" fill="none" stroke="black" stroke-width="2"/>
    <text x="160" y="178" font-size="13" fill="#0055aa" text-anchor="middle">R₂=6Ω</text>
    <line x1="190" y1="200" x2="240" y2="200" stroke="black" stroke-width="2"/>
    <!-- 并联合并到R3 -->
    <line x1="240" y1="100" x2="240" y2="200" stroke="black" stroke-width="2"/>
    <!-- R3 -->
    <line x1="240" y1="150" x2="290" y2="150" stroke="black" stroke-width="2"/>
    <rect x="290" y="135" width="60" height="30" fill="none" stroke="black" stroke-width="2"/>
    <text x="320" y="128" font-size="13" fill="#2a2" text-anchor="middle">R₃=3Ω</text>
    <line x1="350" y1="150" x2="390" y2="150" stroke="black" stroke-width="2"/>
    <!-- 连回电源 -->
    <line x1="390" y1="150" x2="390" y2="100" stroke="black" stroke-width="2"/>
    <line x1="390" y1="100" x2="450" y2="100" stroke="black" stroke-width="2"/>
    <!-- 计算 -->
    <text x="200" y="270" font-size="14" fill="#333">R并 = R₁R₂/(R₁+R₂) = 4×6/10 = 2.4Ω</text>
    <text x="200" y="295" font-size="14" fill="#333">R总 = R并 + R₃ = 2.4 + 3 = 5.4Ω</text>
    <text x="200" y="318" font-size="15" fill="#d00" font-weight="bold">I总 = U/R总 = 12/5.4 ≈ 2.22A</text>
  </g>
</svg>