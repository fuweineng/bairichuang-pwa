<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial">
  <text x="350" y="25" text-anchor="middle" font-size="17" fill="#333">容器底面积0.01m²，盛满水，液面高0.2m，求水对容器底部的压强</text>
  <g transform="translate(120,60)">
    <!-- 容器 -->
    <rect x="0" y="0" width="200" height="160" fill="#d6eeff" stroke="black" stroke-width="2"/>
    <!-- 水面 -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#0074d9" stroke-width="2"/>
    <!-- 液面高度h -->
    <line x1="-25" y1="0" x2="-25" y2="160" stroke="#d00" stroke-width="1.5"/>
    <line x1="-30" y1="0" x2="-20" y2="0" stroke="#d00" stroke-width="1.5"/>
    <line x1="-30" y1="160" x2="-20" y2="160" stroke="#d00" stroke-width="1.5"/>
    <text x="-55" y="80" font-size="14" fill="#d00" font-weight="bold" transform="rotate(-90,-55,80)">h=0.2m</text>
    <!-- 底部压强示意 -->
    <line x1="0" y1="200" x2="200" y2="200" stroke="#0055aa" stroke-width="2"/>
    <text x="100" y="220" text-anchor="middle" font-size="14" fill="#0055aa">容器底部</text>
    <!-- 标注 -->
    <text x="100" y="-12" font-size="13" fill="#333">S = 0.01m²</text>
    <text x="100" y="185" font-size="13" fill="#0055aa">ρgh = 1000×10×0.2</text>
    <text x="100" y="205" font-size="14" fill="#d00" font-weight="bold">p = 2000 Pa</text>
  </g>
</svg>