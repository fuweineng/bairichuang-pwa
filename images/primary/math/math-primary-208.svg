<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="Arial">
  <text x="400" y="25" text-anchor="middle" font-size="18" fill="#333">哪个图形只有一个平行边（梯形）？</text>
  <g transform="translate(100,50)">
    <polygon points="10,110 90,110 90,30 10,30" fill="none" stroke="black" stroke-width="2"/>
    <text x="50" y="150" text-anchor="middle" font-size="16">A 正方形</text>
    <text x="50" y="168" text-anchor="middle" font-size="12" fill="#d00">两组平行边</text>
  </g>
  <g transform="translate(300,50)">
    <polygon points="15,30 85,30 70,110 30,110" fill="none" stroke="black" stroke-width="2"/>
    <text x="50" y="150" text-anchor="middle" font-size="16">B 平行四边形</text>
    <text x="50" y="168" text-anchor="middle" font-size="12" fill="#d00">两组平行边</text>
  </g>
  <g transform="translate(500,50)">
    <polygon points="10,30 90,30 70,110 30,110" fill="none" stroke="black" stroke-width="2.5"/>
    <text x="50" y="150" text-anchor="middle" font-size="16" font-weight="bold">C 梯形</text>
    <text x="50" y="168" text-anchor="middle" font-size="12" fill="#2a2">一组平行边</text>
  </g>
  <g transform="translate(700,50)">
    <polygon points="50,130 90,30 10,30" fill="none" stroke="black" stroke-width="2"/>
    <text x="50" y="150" text-anchor="middle" font-size="16">D 三角形</text>
    <text x="50" y="168" text-anchor="middle" font-size="12" fill="#d00">无边平行</text>
  </g>
</svg>