<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Arial">
  <text x="400" y="25" text-anchor="middle" font-size="18" fill="#333">统计全班同学喜欢的颜色（红、蓝、绿、黄），最好用哪种图表？</text>
  <g transform="translate(100,60)">
    <text x="50" y="0" text-anchor="middle" font-size="14" fill="#d00">● 红色</text>
    <text x="50" y="20" text-anchor="middle" font-size="14" fill="#00a">● 蓝色</text>
    <text x="50" y="40" text-anchor="middle" font-size="14" fill="#2a2">● 绿色</text>
    <text x="50" y="60" text-anchor="middle" font-size="14" fill="#c90">● 黄色</text>
    <text x="50" y="90" text-anchor="middle" font-size="16">A 折线图</text>
    <text x="50" y="110" text-anchor="middle" font-size="12" fill="#d00">✗ 不合适</text>
  </g>
  <g transform="translate(280,60)">
    <!-- 柱状图 -->
    <rect x="10" y="50" width="18" height="40" fill="#d00"/>
    <rect x="32" y="30" width="18" height="60" fill="#00a"/>
    <rect x="54" y="40" width="18" height="50" fill="#2a2"/>
    <rect x="76" y="20" width="18" height="70" fill="#c90"/>
    <line x1="0" y1="90" x2="100" y2="90" stroke="black" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="90" stroke="black" stroke-width="1"/>
    <text x="50" y="115" text-anchor="middle" font-size="16">B 柱状图</text>
    <text x="50" y="133" text-anchor="middle" font-size="12" fill="#2a2">✓ 最合适</text>
  </g>
  <g transform="translate(460,60)">
    <!-- 饼图 -->
    <circle cx="50" cy="45" r="40" fill="none" stroke="black" stroke-width="2"/>
    <path d="M50,45 L50,5 A40,40 0 0,1 90,45 Z" fill="#d00"/>
    <path d="M50,45 L90,45 A40,40 0 0,1 10,45 Z" fill="#00a"/>
    <path d="M50,45 L10,45 A40,40 0 0,1 50,85 Z" fill="#2a2"/>
    <path d="M50,45 L50,85 A40,40 0 0,1 50,5 Z" fill="#c90"/>
    <text x="50" y="115" text-anchor="middle" font-size="16">C 饼图</text>
    <text x="50" y="133" text-anchor="middle" font-size="12" fill="#2a2">✓ 也合适</text>
  </g>
  <g transform="translate(640,60)">
    <!-- 散点图（不合适） -->
    <circle cx="20" cy="60" r="4" fill="black"/>
    <circle cx="35" cy="40" r="4" fill="black"/>
    <circle cx="50" cy="70" r="4" fill="black"/>
    <circle cx="65" cy="30" r="4" fill="black"/>
    <circle cx="80" cy="50" r="4" fill="black"/>
    <line x1="0" y1="90" x2="100" y2="90" stroke="black" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="90" stroke="black" stroke-width="1"/>
    <text x="50" y="115" text-anchor="middle" font-size="16">D 散点图</text>
    <text x="50" y="133" text-anchor="middle" font-size="12" fill="#d00">✗ 不合适</text>
  </g>
</svg>