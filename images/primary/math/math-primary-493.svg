<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial">
  <text x="300" y="25" text-anchor="middle" font-size="16" fill="#333">小明1-5月阅读图书数量折线图（单位：本）</text>
  <g transform="translate(80,50)">
    <!-- Y轴 -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="black" stroke-width="1.5"/>
    <!-- X轴 -->
    <line x1="0" y1="200" x2="450" y2="200" stroke="black" stroke-width="1.5"/>
    <!-- Y刻度 -->
    <text x="-10" y="5" font-size="11" text-anchor="end">20</text>
    <text x="-10" y="55" font-size="11" text-anchor="end">15</text>
    <text x="-10" y="105" font-size="11" text-anchor="end">10</text>
    <text x="-10" y="155" font-size="11" text-anchor="end">5</text>
    <text x="-10" y="205" font-size="11" text-anchor="end">0</text>
    <!-- 数据：1月12, 2月15, 3月10, 4月18, 5月14 -->
    <circle cx="0" cy="80" r="5" fill="#0074d9"/>
    <circle cx="90" cy="50" r="5" fill="#0074d9"/>
    <circle cx="180" cy="100" r="5" fill="#0074d9"/>
    <circle cx="270" cy="20" r="5" fill="#0074d9"/>
    <circle cx="360" cy="60" r="5" fill="#0074d9"/>
    <!-- 折线 -->
    <polyline points="0,80 90,50 180,100 270,20 360,60" fill="none" stroke="#0074d9" stroke-width="2"/>
    <!-- X轴 -->
    <text x="0" y="225" text-anchor="middle" font-size="13">1月</text>
    <text x="90" y="225" text-anchor="middle" font-size="13">2月</text>
    <text x="180" y="225" text-anchor="middle" font-size="13">3月</text>
    <text x="270" y="225" text-anchor="middle" font-size="13">4月</text>
    <text x="360" y="225" text-anchor="middle" font-size="13">5月</text>
    <!-- 数值 -->
    <text x="0" y="70" text-anchor="middle" font-size="12" fill="#0074d9">12本</text>
    <text x="90" y="40" text-anchor="middle" font-size="12" fill="#0074d9">15本</text>
    <text x="180" y="90" text-anchor="middle" font-size="12" fill="#0074d9">10本</text>
    <text x="270" y="10" text-anchor="middle" font-size="12" fill="#d00" font-weight="bold">18本★</text>
    <text x="360" y="50" text-anchor="middle" font-size="12" fill="#0074d9">14本</text>
    <!-- 问题 -->
    <text x="180" y="260" text-anchor="middle" font-size="15" fill="#d00">4月阅读最多（18本）</text>
  </g>
</svg>