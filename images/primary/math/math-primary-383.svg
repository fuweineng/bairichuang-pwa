<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Arial">
  <text x="300" y="25" text-anchor="middle" font-size="16" fill="#333">小华一周温度记录折线图（单位：℃）</text>
  <g transform="translate(80,50)">
    <!-- Y轴 -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="black" stroke-width="1.5"/>
    <!-- X轴 -->
    <line x1="0" y1="200" x2="450" y2="200" stroke="black" stroke-width="1.5"/>
    <!-- Y轴刻度 -->
    <text x="-10" y="5" font-size="11" text-anchor="end">26</text>
    <line x1="-3" y1="0" x2="0" y2="0" stroke="black"/>
    <text x="-10" y="55" font-size="11" text-anchor="end">22</text>
    <line x1="-3" y1="50" x2="0" y2="50" stroke="black"/>
    <text x="-10" y="105" font-size="11" text-anchor="end">17</text>
    <line x1="-3" y1="100" x2="0" y2="100" stroke="black"/>
    <text x="-10" y="155" font-size="11" text-anchor="end">12</text>
    <line x1="-3" y1="150" x2="0" y2="150" stroke="black"/>
    <text x="-10" y="205" font-size="11" text-anchor="end">7</text>
    <line x1="-3" y1="200" x2="0" y2="200" stroke="black"/>
    <!-- 数据点：周一20,周二22,周三25,周四23,周五26 -->
    <circle cx="0" cy="100" r="5" fill="#0074d9"/>
    <circle cx="90" cy="50" r="5" fill="#0074d9"/>
    <circle cx="180" cy="0" r="5" fill="#0074d9"/>
    <circle cx="270" cy="50" r="5" fill="#0074d9"/>
    <circle cx="360" cy="0" r="5" fill="#0074d9"/>
    <!-- 折线 -->
    <polyline points="0,100 90,50 180,0 270,50 360,0" fill="none" stroke="#0074d9" stroke-width="2"/>
    <!-- X轴标签 -->
    <text x="0" y="225" text-anchor="middle" font-size="13">周一</text>
    <text x="90" y="225" text-anchor="middle" font-size="13">周二</text>
    <text x="180" y="225" text-anchor="middle" font-size="13">周三</text>
    <text x="270" y="225" text-anchor="middle" font-size="13">周四</text>
    <text x="360" y="225" text-anchor="middle" font-size="13">周五</text>
    <!-- 数据值 -->
    <text x="0" y="90" text-anchor="middle" font-size="12" fill="#0074d9">20℃</text>
    <text x="90" y="40" text-anchor="middle" font-size="12" fill="#0074d9">22℃</text>
    <text x="180" y="-10" text-anchor="middle" font-size="12" fill="#0074d9">25℃</text>
    <text x="270" y="40" text-anchor="middle" font-size="12" fill="#0074d9">23℃</text>
    <text x="360" y="-10" text-anchor="middle" font-size="12" fill="#0074d9">26℃</text>
    <!-- 问题 -->
    <text x="200" y="265" text-anchor="middle" font-size="14" fill="#d00">周三到周四降温了2℃</text>
  </g>
</svg>